<body class="main-container screen-dim min-screen">

	<div class="col-flex inherit-dim">

		<nav class="foo-color base-to-abs">

			<section class="topbar base-to-abs out-main-burger">
				<img class="double-board inflexible circle-radius hover-grow active-shrink logo-dim" src="./resources/images/foo.svg" alt=" " />

				<a id="open-main-burger" class="no-std-style generic-link topbar-item inflexible hover-grow active-shrink" href="#">
					<i class="fa-solid fa-bars"></i>
				</a>
			</section>

			<section class="foo-color ins-main-burger hidden abs-0x0 inherit-dim">
				<ul class="no-std-style grid-col4 inherit-dim children-on-center">
					<li class="horiz-list-item hover-grow active-shrink">
						<a class="no-std-style generic-link title-fsize" href="#">
							<i class="fa-brands fa-github"></i>
						</a>
					</li>
					<li class="horiz-list-item hover-grow active-shrink">
						<a class="no-std-style generic-link title-fsize" href="#">
							<i class="fa-brands fa-linkedin"></i>
						</a>
					</li>
					<li class="horiz-list-item hover-grow active-shrink">
						<a class="no-std-style generic-link title-fsize" href="#">
							<i class="fa-brands fa-itch-io"></i>
						</a>
					</li>
					<li id="close-main-burger" class="horiz-list-item hover-grow active-shrink">
						<a class="no-std-style generic-link title-fsize" href="#">
							<i class="fa-solid fa-xmark"></i>
						</a>
					</li>
				</ul>
			</section>

		</nav>

		<aside class="foo-color2 ins-main-burger hidden fill-flex static-pos">
			<ul class="no-std-style text-on-center col-flex vert-gap">
				<li class="inline active-shrink hi-hover-trans">
					<a class="no-std-style inline subtitle-fsize inherit-cursor inherit-dim" href="https://github.com/duckafire" target="_blank">Foo</a>
				</li>
				<li class="inline active-shrink hi-hover-trans">
					<a class="no-std-style inline subtitle-fsize inherit-cursor inherit-dim" href="https://github.com/duckafire" target="_blank">Foo</a>

				<li class="inline active-shrink hi-hover-trans">
					<a class="no-std-style inline subtitle-fsize inherit-cursor inherit-dim" href="https://github.com/duckafire" target="_blank">Foo</a>
				</li>
			</ul>
		</aside>
