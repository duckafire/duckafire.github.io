<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd"> 
<html lang="pt-BR" class="using-theme-legacy">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
	<title id ="page-title">DuckAfire's Nest: trabalho em progresso</title>
	<link rel="icon" href="./resources/images/foo.svg" />

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
	<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"/>
	<script src="https://kit.fontawesome.com/7d914c2988.js" crossorigin="anonymous" async="async"></script>

	<link rel="stylesheet" href="./style/css/core.css"/>
</head>
<body class="main-container screen-dim min-screen h-max-content scroll-y tlegacy:font-color tlegacy:bg-0">

	<nav class="vw100 set-height sticky-0x0 move-to-forward"
		style="
			--height: 70.4px;
		">

		<div class="inherit-dim relative-pos">
			<div id="main-topbar" class="inherit-dim abs-0x0 tlegacy:bg-2">
				<section class="topbar children-on-center set-pair-padding" style="
						--padding-inline: 0.9rem;
						--padding-block: 0.55rem;
					">
					<a href="#" class="no-std-style">
						<img class="double-board inflexible circle-radius hover-grow active-shrink" src="./resources/images/foo.svg" alt=" " width="52.8" height="52.8" loading="lazy" />
					</a>

					<ul id="topbar-menu-list" class="no-std-style rev-flex children-on-center gap-one-h-fifty-rem">
						<li>
							<button id="open-main-burger" class="no-std-style topbar-item inflexible hover-pointer tlegacy:icon-btn"
								style="
									--glink-color-normal: orange;
									--glink-color-hover: red;
									--glink-color-active: yellow;
								">
								<i class="fa-solid fa-bars"></i>
							</button>
						</li>
					</ul>
				</section>
			</div>
			<div id="main-topbar-shadow" class="abs-0x0 backdrop inherit-height only-not-at-mobile
				tb:set-width " style="display:none;
					/* based #burger-topbar values */
					--tb-width: calc(100vw - 450px);
				"></div>
			<div id="burger-topbar" class="inherit-dim abs-0x0 tlegacy:bg-2
					tb:set-left tb:set-width tb:relative-pos tb:no-min-dim
				" style="display:none;
					/* equal #burger-menu values */
					--tb-left: calc(100vw - 450px);
					--tb-width: 450px;
				">
				<ul id="burger-menu-list" class="no-std-style block-dis rev-grid inherit-dim children-on-center fsize-one-h-fifty-rem"
					style="
						--grid-columns: 4;
						--glink-cont-color-normal: orange;
						--glink-cont-color-hover: red;
						--glink-cont-color-active: yellow;
					">
					<li id="close-main-burger">
						<button class="no-std-style title-fsize hover-pointer tlegacy:icon-btn" href="#">
							<i class="fa-solid fa-xmark"></i>
						</button>
					</li>
				</ul>
			</div>
		</div>

	</nav>

	<aside id="burger-menu" class="fixed-pos move-to-forward vw-100 set-height
		tb:set-left tb:set-width"
		style="display:none;
			--height: calc(100dvh - 70.4px);
			/* equal #burger-topbar values */
			--tb-left: calc(100vw - 450px);
			--tb-width: 450px;
		">
		<div class="abs-0x0 backdrop inherit-height only-not-at-mobile
			tb:set-left tb:set-width " style="
				/* based #burger-topbar values */
				--tb-left: calc( (100vw - 450px) * -1 );
				--tb-width: calc(100v - 450px);
			"></div>
		<div class="inherit-dim scroll-y tlegacy:bg-1">
			<ul class="no-std-style text-on-center flex-col vert-gap">
				<li class="inline active-shrink subtitle-fsize tlegacy:live-burger-btn">
					<button class="no-std-style inherit-cursor inherit-dim">
						<a class="no-std-style inherit-cursor inherit-dim" href="#" rel="noopener noreferrer">
							Foo
						</a>
					</button>
				</li>
			</ul>
		</div>

	</aside>

	<main>

		<div class="lined-title tlegacy:color-line-bar-2">
			<h1>Destaques</h1>
		</div>

		<div class="flex-col children-on-center">
			<div class="manual-vert-swiper">
				<ul id="highlight-cards-container" class="swiper-wrapper highlight-projects-list">
					<!-- components -->
				</ul>
				<div class="swiper-btn-container disable-events">
					<button class="vert-swiper-btn-prev enable-events hover-pointer tlegacy:live-bg tlegacy:live-low-opacity"></button>
					<button class="vert-swiper-btn-next enable-events hover-pointer tlegacy:live-bg tlegacy:live-low-opacity"></button>
				</div>
			</div>
		</div>

		<div class="lined-title tlegacy:color-line-bar-2">
			<h1>Projetos</h1>
		</div>

		<ul id="cards-container" class="projects-list">
			<!-- components -->
		</ul>

	</main>

	<footer class="page-footer tlegacy:bg-1">

		<ul class="footer-cell">
			<li><h1>Foo</h1></li>
			<li><h2><a href="#" class="t-link" rel="noopener noreferrer">Foo</a></h2></li>
			<li><h2><a href="#" class="t-link" rel="noopener noreferrer">Foo</a></h2></li>
			<li><h2><a href="#" class="t-link" rel="noopener noreferrer">Foo</a></h2></li>
		</ul>
		<ul class="footer-cell">
			<li><h1>Foo</h1></li>
			<li><h2><a href="#" class="t-link" rel="noopener noreferrer">Foo</a></h2></li>
			<li><h2><a href="#" class="t-link" rel="noopener noreferrer">Foo</a></h2></li>
			<li><h2><a href="#" class="t-link" rel="noopener noreferrer">Foo</a></h2></li>
		</ul>
		<ul class="footer-cell">
			<li><h1>Foo</h1></li>
			<li><h2><a href="#" class="t-link" rel="noopener noreferrer">Foo</a></h2></li>
			<li><h2><a href="#" class="t-link" rel="noopener noreferrer">Foo</a></h2></li>
			<li><h2><a href="#" class="t-link" rel="noopener noreferrer">Foo</a></h2></li>
		</ul>

	</footer>

</body>

<script src="./js/constants.js">

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="./js/swiper/highlight-projects-list.js"></script>

<script src="./js/events.js"></script>

<script src="./js/components/cards/data-json.js"></script>

</html>
