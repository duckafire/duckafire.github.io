<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd"> 
<html lang="en-US">
<head>
	<title>DuckAfire's Nest</title>

	<meta charset="utf8"/>

	<link rel="stylesheet" type="text/css" href="./index.css"/>

	<script src="https://kit.fontawesome.com/7d914c2988.js" crossorigin="anonymous" async="async"></script>

	<style>
		*
		{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: sans-serif, serif;
		}

		figure > img
		{
			width: 100%;
			height: 100%;
		}

		body,
		button
		{
			color: #c0c0c0;
		}

		button
		{
			text-align: start;
			font-size: 1em;
		}

		button,
		input
		{
			background: none;
			border: none;
		}

		ol.clear-style,
		ul.clear-style
		{
			list-style: none;

		}

		details.clear-style:not([open])
		{
			display: none;
		}

		details.clear-style > summary
		{
			display: none;
		}
	</style>
</head>
<body class="home-body">
	<main class="card">
		<section class="card-content">
			<figure class="main-card-image">
				<img src=" " alt="DuckAfire's perfil image."/>
			</figure>
			<div class="perfil-miscellaneous-container">
				<h1 class="perfil-welcome-phrase">Hello world!</h1>
				<div class="perfil-details-manager">
					<button class="perfil-ball-button details-manager-button fa-solid fa-plus"></button>
				</div>
			</div>
		</section>
		<details class="clear-style card-details">
			<summary></summary>
			<div>
				<div class="card-details-related">
					<h1 class="card-details-title">Related</h1>
					<ul class="clear-style links-list">
						<li class="links-list-item">
							<div class="links-list-button">
								<button>
									<span class="links-list-description">http</span>
								</button>
							</div>
							<button>
								<i class="links-list-url-copier fa-solid fa-copy"></i>
							</button>
						</li>
					</ul>
				</div>
			</div>
		</details>
	</main>
	<ul class="clear-style">
		<div class="card">
			<section class="card-content">
				<figure class="card-icon">
					<img src=" " alt="foo"/>
				</figure>
				<ul class="clear-style card-options">
					<li><button class="ball-button details-manager-button fa-solid fa-plus"></button></li>
					<li><button class="ball-button card-favoriter fa-regular fa-star"></button></li>
					<li><button class="ball-button fa-solid fa-external-link"></button></li>
				</ul>
			</section>
			<details class="clear-style card-details">
				<summary></summary>
				<div>
					<ul class="clear-style links-list">
						<li class="links-list-item">
							<div class="links-list-button">
								<button>
									<i class="details-ball-button fa-solid fa-folder"></i>
									<span class="links-list-description">Foo</span>
								</button>
							</div>
							<button>
								<i class="links-list-url-copier fa-solid fa-copy"></i>
							</button>
						</li>
					</ul>
					<div class="card-details-related">
						<h1 class="card-details-title">Related</h1>
						<ul class="clear-style links-list">
							<li class="links-list-item">
								<div class="links-list-button">
									<button>
										<span class="links-list-description">http</span>
									</button>
								</div>
								<button>
									<i class="links-list-url-copier fa-solid fa-copy"></i>
								</button>
							</li>
						</ul>
					</div>
				</div>
			</details>
		</div>
	</ul>
</body>
<script src="index.js"></script>
</html>
