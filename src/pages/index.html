<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd"> 
<html lang="en-US">
<head>
	<title>DuckAfire's Nest</title>

	<meta charset="utf8"/>

	<link rel="stylesheet" type="text/css" href="./index.css"/>

	<script src="https://kit.fontawesome.com/7d914c2988.js" crossorigin="anonymous" async="async"></script>

	<style>
		*
		{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: sans-serif, serif;
		}

		body
		{
			width: 100vw;
			height: 100vh;
			height: 100dvh;
			background-color: #1f1f1f;
		}

		figure > img
		{
			width: 100%;
			height: 100%;
		}

		body,
		button
		{
			color: #c0c0c0;
		}

		button
		{
			text-align: start;
			font-size: 1em;
		}

		button,
		input
		{
			background: none;
			border: none;
		}
	</style>
</head>
<body>
	<div class="skill-container-alpha">
		<div class="skill-container-beta">
			<div class="skill-item">
				<section class="skill-content">
					<figure class="skill-icon image">
						<img src=" " alt="DuckAfire's perfil image."/>
					</figure>
					<div class="skill-perfil-options">
						<h1 class="skill-perfil-title">Hello world!</h1>
						<!-- EMPURRAR ISSO PARA O EXTREMO DE BAIXO E ALINHAR HORIZONTALMENTE -->
						<div class="skill-perfil-details-manager">
							<button class="skill-content-btn fa-solid fa-plus skill-details-manager"></button>
						</div>
					</div>
				</section>
				<details id="skill-details-0" class="skill-details">
					<summary></summary>
					<div>
						<div class="skill-details-related">
							<h1 class="skill-details-related-title">Related</h1>
							<ul class="skill-details-options">
								<li class="skill-details-option-item">
									<div class="skill-details-open-url">
										<button class="skill-details-open-url-btn">
											<span class="skill-details-mobile-btn-description">http</span>
										</button>
									</div>
									<button>
										<i class="skill-details-copy-url fa-solid fa-copy"></i>
									</button>
								</li>
							</ul>
						</div>
					</div>
				</details>
			</div>
			<ul class="skill-list">
				<div class="skill-item">
					<section class="skill-content">
						<figure class="skill-icon image">
							<img src=" " alt="foo"/>
						</figure>
						<ul class="skill-content-options">
							<li><button class="skill-content-btn fa-solid fa-plus skill-details-manager"></button></li>
							<li><button class="skill-content-btn fa-regular fa-star skill-favorite-btn"></button></li>
							<li><button class="skill-content-btn fa-solid fa-external-link"></button></li>
						</ul>
					</section>
					<details id="skill-details-1" class="skill-details">
						<summary></summary>
						<div>
							<ul class="skill-details-options">
								<!-- repository license wiki play docs
								folder - book gamepad -  -->
								<li class="skill-details-option-item">
									<div class="skill-details-open-url">
										<button class="skill-details-open-url-btn">
											<i class="skill-details-content-btn fa-solid fa-folder"></i>
											<span class="skill-details-mobile-btn-description">Foo</span>
										</button>
									</div>
									<button>
										<i class="skill-details-copy-url fa-solid fa-copy"></i>
									</button>
								</li>
							</ul>
							<div class="skill-details-related">
								<h1 class="skill-details-related-title">Related</h1>
								<ul class="skill-details-options">
									<li class="skill-details-option-item">
										<div class="skill-details-open-url">
											<button class="skill-details-open-url-btn">
												<span class="skill-details-mobile-btn-description">http</span>
											</button>
										</div>
										<button>
											<i class="skill-details-copy-url fa-solid fa-copy"></i>
										</button>
									</li>
								</ul>
							</div>
						</div>
					</details>
				</div>
			</ul>
		</div>
	</div>
	<!--
	<div>
		<i class="fa-brands fa-npm"></i>
		<i class="fa-brands fa-github"></i>
		<i class="fa-brands fa-gitlab"></i>
		<i class="fa-brands fa-docker"></i>
		<i class="fa-brands fa-itch-io"></i>
	</div>
	-->
</body>
<script src="index.js"></script>
</html>
